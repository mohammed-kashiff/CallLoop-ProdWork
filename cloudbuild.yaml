# CL-40: builds Dockerfile.selfhosted with HF_TOKEN passed in as a Secret
# Manager-backed BuildKit secret — it never becomes a build arg, an image
# layer, or a line in these build logs.
#
# One-time setup before this runs (commands given separately):
#   1. Store the token: gcloud secrets create hf-token --data-file=-
#   2. Grant Cloud Build's own service account "Secret Manager Secret Accessor"
#      on that secret.

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/hf-token/versions/latest
      env: 'HF_TOKEN'

steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        DOCKER_BUILDKIT=1 docker build \
          --secret id=hf_token,env=HF_TOKEN \
          -f Dockerfile.selfhosted \
          -t "${_IMAGE_URI}" .
    secretEnv: ['HF_TOKEN']

images:
  - '${_IMAGE_URI}'

substitutions:
  _IMAGE_URI: us-central1-docker.pkg.dev/${PROJECT_ID}/calloop/selfhosted:latest

options:
  logging: CLOUD_LOGGING_ONLY
