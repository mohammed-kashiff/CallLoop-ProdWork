name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    name: Isolation (Org A cannot reach Org B)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: callproof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/callproof_test
      CALLPROOF_SKIP_STARTUP: "1"
      ERROR_NOTIFY_DESKTOP: "false"
      ERROR_NOTIFY_EMAIL: "off"
      ERROR_NOTIFY_WEBHOOK_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Migrate
        run: alembic upgrade head
      - name: Test
        run: pytest -q --tb=short
